# DonationBox - Copyright (c) 2026 Ayam Heniber Meitei <ayamheniber0@gmail.com>

appId: org.temple.donationbox
productName: DonationBox
copyright: Copyright © 2026 Ayam Heniber Meitei

directories:
  output: release/${version}
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
  - prisma-client/**/*
  - '!**/*.map'
  - '!**/{.eslintrc,.editorconfig,.prettierrc,tsconfig.json}'

asarUnpack:
  - prisma-client/*.node

afterPack: build/after-pack.cjs

extraResources:
  - from: src/prisma/schema.prisma
    to: prisma/schema.prisma

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: DonationBox

mac:
  category: public.app-category.finance
  target:
    - target: dmg
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Office
  artifactName: ${productName}-${version}-${arch}.${ext}
